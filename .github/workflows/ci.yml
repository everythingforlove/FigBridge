name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - feature-xjl-0522

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Run quality gates
        run: ./scripts/ci-checks.sh
